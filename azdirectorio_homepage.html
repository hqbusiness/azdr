        </p>

        </div>
      </div>

      ${state.listMode==='list' ? renderGrid(list) : renderMap(list)}

  `;
}

function renderGrid(list){
  if(list.length===0){
    return `<div class="grid"><p class="empty-msg">No se encontraron empresas con esos criterios. Ajusta tu bÃºsqueda.</p></div>`;
  }
  return `<div class="grid">
    ${list.map(b=>`
      <button class="card" data-select="${b.id}">
        <div class="card-top">
          <div class="cat-icon-box"><i data-lucide="${catIcon(b.cat)}"></i></div>
          ${b.verified ? stampHtml(38) : ''}
        </div>
        <div>
          <h3 class="serif">${b.name}</h3>
          <p class="meta">${catLabel(b.cat)} Â· ${b.city}</p>
        </div>
        <p class="desc">${b.desc.slice(0,92)}â¦</p>
        <div class="card-bottom">
          <div style="display:flex;align-items:center;gap:8px;">
            ${starsHtml(b.rating)}
            <span class="mono rating-text">${b.rating} (${b.reviews})</span>
          </div>
          <i data-lucide="chevron-right" style="width:16px;height:16px;color:var(--slate-soft)"></i>
        </div>
      </button>
    `).join('')}
  </div>`;
}

function renderMap(list){
  const pins = list.map(b=>{
    const x = 80 + ((b.id*137) % 640);
    const y = 60 + ((b.id*91) % 300);
    const color = b.verified ? 'var(--brass)' : 'var(--forest)';
    return `<g data-select="${b.id}" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="9" fill="${color}" opacity="0.9"/>
      <circle cx="${x}" cy="${y}" r="14" fill="none" stroke="${color}" stroke-width="1" opacity="0.4"/>
    </g>`;
  }).join('');
  let lines = '';
  for(let i=0;i<9;i++) lines += `<line x1="${i*90}" y1="0" x2="${i*90}" y2="420" stroke="var(--hairline)" stroke-width="1"/>`;
  for(let i=0;i<6;i++) lines += `<line x1="0" y1="${i*80}" x2="800" y2="${i*80}" stroke="var(--hairline)" stroke-width="1"/>`;
  return `<div class="map-box">
    <svg width="100%" height="100%" viewBox="0 0 800 420">
      <rect width="800" height="420" fill="var(--paper-deep)"/>
      ${lines}
      ${pins}
    </svg>
    <p class="map-caption">Vista de mapa ilustrativa â conecta tu proveedor de mapas para ubicaciones reales.</p>
  </div>`;
}

/* ---------- Main render + events ---------- */
function render(){
  const app = document.getElementById('app');
  let html = '';
  if(state.route==='home') html = renderHome();
  else if(state.route==='detail') html = renderDetail();
  else if(state.route==='add1') html = renderAdd1();
  else if(state.route==='add2') html = renderAdd2();
  else if(state.route==='confirmation') html = renderConfirmation();
  app.innerHTML = html;
  attachEvents();
  if(window.lucide) lucide.createIcons();
}

function renderModal(show){
  const root = document.getElementById('modalRoot');
  root.innerHTML = show ? renderLoginModal() : '';
  if(show){
    document.getElementById('closeModalBtn').addEventListener('click', ()=>renderModal(false));
    document.getElementById('modalOverlay').addEventListener('click', (e)=>{
      if(e.target.id==='modalOverlay') renderModal(false);
    });
  }
  if(window.lucide) lucide.createIcons();
}

function attachEvents(){
  if(state.route==='home'){
    const searchInput = document.getElementById('searchInput');
    const cityInput = document.getElementById('cityInput');
    const searchBtn = document.getElementById('searchBtn');
    if(searchInput) searchInput.addEventListener('keyup', e=>{ state.query = e.target.value; if(e.key==='Enter') render(); });
    if(searchBtn) searchBtn.addEventListener('click', ()=>{ state.query = searchInput.value; state.city = cityInput.value; render(); });
    if(cityInput) cityInput.addEventListener('change', e=>{ state.city = e.target.value; render(); });

    document.querySelectorAll('.cat-chip').forEach(el=>{
      el.addEventListener('click', ()=>{ state.activeCat = el.dataset.cat; render(); });
    });
    document.querySelectorAll('.view-toggle button').forEach(el=>{
      el.addEventListener('click', ()=>{ state.listMode = el.dataset.mode; render(); });
    });
    document.querySelectorAll('[data-select]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = parseInt(el.dataset.select);
        state.selected = BUSINESSES.find(b=>b.id===id);
        state.route = 'detail';
        render();
        window.scrollTo(0,0);
      });
    });
  }

  if(state.route==='detail'){
    document.getElementById('backBtn').addEventListener('click', ()=>{ state.route='home'; render(); });
  }

  if(state.route==='add1'){
    document.getElementById('cancelBtn').addEventListener('click', ()=>{ state.route='home'; render(); });
    document.getElementById('toStep2Btn').addEventListener('click', ()=>{
      state.form.name = document.getElementById('f_name').value;
      state.form.cat = document.getElementById('f_cat').value;
      state.form.city = document.getElementById('f_city').value;
      state.form.phone = document.getElementById('f_phone').value;
      state.form.email = document.getElementById('f_email').value;
      state.form.desc = document.getElementById('f_desc').value;
      state.route = 'add2';
      render();
      window.scrollTo(0,0);
    });
  }

  if(state.route==='add2'){
    document.getElementById('backToStep1Btn').addEventListener('click', ()=>{ state.route='add1'; render(); });
    document.querySelectorAll('.plan-card').forEach(el=>{
      el.addEventListener('click', ()=>{ state.plan = el.dataset.plan; render(); });
    });
    const finishBtn = document.getElementById('finishBtn');
    finishBtn.addEventListener('click', ()=>{
      if(state.plan===''){ return; }
      state.route = 'confirmation';
      render();
      window.scrollTo(0,0);
    });
  }

  if(state.route==='confirmation'){
    document.getElementById('finalBackBtn').addEventListener('click', ()=>{
      state.route = 'home';
      state.form = { name:"", cat:"", city:"", phone:"", email:"", desc:"" };
      state.plan = "";
      render();
    });
  }
}

document.getElementById('logoBtn').addEventListener('click', ()=>{ state.route='home'; state.selected=null; render(); });
document.getElementById('addBtn').addEventListener('click', ()=>{ state.route='add1'; render(); window.scrollTo(0,0); });
document.getElementById('loginBtn').addEventListener('click', ()=>renderModal(true));

render();
</script>
